<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الغلاف الخارجي — البرمجة والذكاء الاصطناعي — الترم الأول | أكواد مع زياد</title>
<style>
@font-face{font-family:'Baloo Bhaijaan 2';font-weight:400 800;src:url(fonts/BalooBhaijaan2.ttf) format('truetype')}
@page{size:216mm 303mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#c9c9c9;padding:14pt 0;font-family:'Baloo Bhaijaan 2';direction:rtl}
@media print{body{background:#fff;padding:0}}
.cv{position:relative;width:216mm;height:303mm;margin:0 auto 14pt auto;overflow:hidden;color:#1d1a17;background:#fff;break-after:page;page-break-after:always}
.cv:last-child{break-after:auto;page-break-after:auto}
@media print{.cv{margin:0}}
.n{direction:ltr;unicode-bidi:isolate}
.dots,.brk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* شريطين (برتقالي + أسود رفيع) قاطعين الركن بزاوية 45° — زي شريط لاصق */
.corner{position:absolute;top:16mm;left:-34mm;width:120mm;height:13mm;background:#f98e03;transform:rotate(-45deg)}
.corner::after{content:"";position:absolute;left:0;right:0;top:17mm;height:3.2mm;background:#1d1a17}
.back .corner{top:auto;left:auto;bottom:16mm;right:-34mm}
.back .corner::after{top:auto;bottom:17mm}
/* هايلايتر: شريط برتقالي ورا الكلام، مايل سنة */
.hl,.ttl h2 span,.quote b span{position:relative;z-index:0;display:inline-block}
.ttl h2 span::before,.quote b span::before{content:"";position:absolute;z-index:-1;left:-3mm;right:-3mm;top:38%;bottom:4%;background:#f98e03;border-radius:1.5mm;transform:rotate(-1.4deg)}
/* ---- الوش ---- */
.logo{position:absolute;top:36mm;left:50%;transform:translateX(-50%);width:76mm;height:76mm;border-radius:50%;overflow:hidden;background:#2e271e;
  box-shadow:0 0 0 1.8mm #fff,0 0 0 2.6mm #1d1a17}
.logo img{width:100%;height:100%;display:block}
.ttl{position:absolute;top:128mm;left:0;right:0;text-align:center;line-height:1}
.ttl h1{margin:0;font-size:104pt;font-weight:800;line-height:1;color:#1d1a17;letter-spacing:-1pt}
.ttl h2{margin:10pt 0 0 0;font-size:48pt;font-weight:800;line-height:1.2;color:#1d1a17}
.sub{position:absolute;top:210mm;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1d1a17;color:#fff;border-radius:40pt;
  padding:9pt 26pt 11pt 26pt;font-size:24pt;font-weight:800;line-height:1}
.sub i{display:inline-block;width:8pt;height:8pt;border-radius:50%;background:#f98e03;margin:0 12pt;vertical-align:middle}
.who{position:absolute;bottom:22mm;left:0;right:0;text-align:center;line-height:1.2}
.who b{display:block;font-size:36pt;font-weight:800;color:#1d1a17}
.who span{font-size:17pt;font-weight:800;color:#c86a00;letter-spacing:.5pt}
/* ---- الضهر ---- */
.quote{position:absolute;top:58mm;left:16mm;right:16mm;text-align:center}
.quote .qmk{display:block;font-size:70pt;line-height:1;color:#f98e03;font-weight:800;direction:ltr;margin-bottom:6pt}
.quote p{margin:0;font-size:38pt;line-height:1.6;font-weight:800;color:#1d1a17}
.qrs{position:absolute;top:165mm;left:0;right:0;display:flex;justify-content:center;gap:24mm}
.qb{display:flex;flex-direction:column;align-items:center;gap:7pt}
.qb .qr{width:42mm;height:42mm;background:#fff;border-radius:10pt;padding:3mm;border:1.6pt solid #1d1a17}
.qb .qr img{width:100%;height:100%;display:block}
.qb b{font-size:19pt;font-weight:800;color:#1d1a17;line-height:1}
.foot{position:absolute;bottom:22mm;left:0;right:0;text-align:center;line-height:1.3}
.foot b{display:block;font-size:30pt;font-weight:800;color:#1d1a17}
.foot span{font-size:20pt;font-weight:800;color:#c86a00}
</style>
</head>
<body>
<section class="cv front">
  <svg class="dots" viewBox="0 0 216 303" preserveAspectRatio="none"><defs><pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".42" fill="#c9c4bc"/></pattern></defs><rect width="216" height="303" fill="url(#dp)"/></svg>
  <div class="corner"></div>
  <svg class="brk" viewBox="0 0 216 303" preserveAspectRatio="none"><g fill="none" stroke="#f98e03" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"><path d="M58.0 47.0 L36.9 74.0 L58.0 101.0"/><path d="M158.0 47.0 L179.1 74.0 L158.0 101.0"/></g></svg>
  <div class="logo"><img src="assets/logo_warm.jpg" alt=""></div>
  <div class="ttl"><h1>البرمجة</h1><h2><span>والذكاء الاصطناعي</span></h2></div>
  <div class="sub">الصف الثاني الثانوي <i></i> الترم الأول</div>
  <div class="who"><b>أ/ زياد السعدني</b><span><span class="n">2026 / 2027</span></span></div>
</section>
<section class="cv back">
  <svg class="dots" viewBox="0 0 216 303" preserveAspectRatio="none"><defs><pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".42" fill="#c9c4bc"/></pattern></defs><rect width="216" height="303" fill="url(#dp)"/></svg>
  <div class="corner"></div>
  <div class="quote"><span class="qmk">{ }</span><p>الكود مجرد أداة…<br><b><span>القوة الحقيقية في طريقة تفكيرك.</span></b></p></div>
  <div class="qrs">
    <div class="qb"><div class="qr"><img src="assets/qr_fb_warm.svg" alt=""></div><b>فيسبوك</b></div>
    <div class="qb"><div class="qr"><img src="assets/qr_yt_warm.svg" alt=""></div><b>يوتيوب</b></div>
  </div>
  <div class="foot"><b>أكواد مع زياد</b><span>واتساب <span class="n">01124840835</span></span></div>
</section>
<script>document.fonts.ready.then(() => document.body.dataset.ready = "1")</script>
</body>
</html>
