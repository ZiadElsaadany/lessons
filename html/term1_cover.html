<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الغلاف الخارجي — البرمجة والذكاء الاصطناعي — الترم الأول | أكواد مع زياد</title>
<style>
@font-face{font-family:'Baloo Bhaijaan 2';font-weight:400 800;src:url(fonts/BalooBhaijaan2.ttf) format('truetype')}
@font-face{font-family:'CairoX';font-weight:900;src:url(fonts/Cairo-Black.ttf) format('truetype')}
@font-face{font-family:'CairoX';font-weight:700;src:url(fonts/Cairo-Bold.ttf) format('truetype')}
@font-face{font-family:'CodeMono';src:url(fonts/DejaVuSansMono-Bold.ttf) format('truetype');unicode-range:U+0000-024F}
@page{size:216mm 303mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#bdbdbd;padding:14pt 0;font-family:'CairoX','Baloo Bhaijaan 2';direction:rtl}
@media print{body{background:#fff;padding:0}}
.cv{position:relative;width:216mm;height:303mm;margin:0 auto 14pt auto;overflow:hidden;color:#1d1a17;background:#ffe3bf;break-after:page;page-break-after:always}
.cv:last-child{break-after:auto;page-break-after:auto}
@media print{.cv{margin:0}}
.n{direction:ltr;unicode-bidi:isolate}
/* علامة مائية: أقواس كود ضخمة باهتة ورا كل حاجة */
.wm{position:absolute;left:-12mm;top:96mm;font-family:'CodeMono';font-size:360pt;line-height:1;color:#fbd29f;direction:ltr;letter-spacing:-20pt;white-space:nowrap}
.back .wm{left:auto;right:-20mm;top:150mm;font-size:300pt}
/* ---- الوش ---- */
.top{position:absolute;top:13mm;left:14mm;right:14mm;display:flex;align-items:center;justify-content:space-between;direction:ltr}
.mini{width:22mm;height:22mm;border-radius:50%;border:2pt solid #1d1a17}
.yr{font-family:'CodeMono';font-size:15pt;color:#fff;background:#1d1a17;border-radius:20pt;padding:5pt 14pt}
.ttl{position:absolute;top:33mm;left:0;right:0;text-align:center}
.ttl h1{margin:0;font-weight:900;font-size:108pt;line-height:1.05;color:#1d1a17}
.ttl h2{margin:6pt 0 0 0;font-weight:900;font-size:48pt;line-height:1.15;color:#c86a00}
.grade{display:inline-block;margin-top:9pt;background:#1d1a17;color:#fff;border-radius:30pt;padding:5pt 20pt 7pt 20pt;font-weight:700;font-size:19pt;line-height:1.3}
.grade i{display:inline-block;width:7pt;height:7pt;border-radius:50%;background:#f98e03;margin:0 9pt;vertical-align:middle}
.disc{position:absolute;left:58mm;top:130mm;width:136mm;height:136mm;border-radius:50%;background:#f98e03}
.disc::after{content:"";position:absolute;inset:7mm;border-radius:50%;border:1.6pt dashed rgba(29,26,23,.45)}
.me{position:absolute;left:68mm;bottom:40mm;height:148mm}
.robot{position:absolute;left:162mm;top:124mm;width:36mm;transform:rotate(10deg)}
.brk{position:absolute;left:16mm;top:138mm;width:36mm;transform:rotate(-8deg)}
.chip{position:absolute;left:176mm;top:206mm;width:24mm;transform:rotate(-10deg)}
.robot svg,.brk svg,.chip svg{width:100%;display:block}
.card{position:absolute;left:12mm;top:180mm;width:58mm;background:#fff;border:2.2pt solid #1d1a17;border-radius:4mm;overflow:hidden;transform:rotate(-4deg);direction:ltr}
.cbar{height:6.5mm;background:#1d1a17;display:flex;align-items:center;gap:4pt;padding:0 7pt}
.cbar b{width:7pt;height:7pt;border-radius:50%;background:#fff}.cbar b:first-child{background:#f98e03}
.card pre{margin:0;padding:4mm 4mm 4.5mm 4mm;font-family:'CodeMono';font-size:13pt;line-height:1.5;color:#1d1a17}
.card k{color:#c86a00}.card v{color:#2f8f46}
.name{position:absolute;left:0;right:0;bottom:12mm;text-align:center;line-height:1}
.name b{display:block;font-weight:900;font-size:66pt;line-height:1.1;color:#1d1a17;text-shadow:2.60pt 0.00pt 0 #ffe3bf,2.40pt 0.99pt 0 #ffe3bf,1.84pt 1.84pt 0 #ffe3bf,0.99pt 2.40pt 0 #ffe3bf,0.00pt 2.60pt 0 #ffe3bf,-0.99pt 2.40pt 0 #ffe3bf,-1.84pt 1.84pt 0 #ffe3bf,-2.40pt 0.99pt 0 #ffe3bf,-2.60pt 0.00pt 0 #ffe3bf,-2.40pt -0.99pt 0 #ffe3bf,-1.84pt -1.84pt 0 #ffe3bf,-0.99pt -2.40pt 0 #ffe3bf,-0.00pt -2.60pt 0 #ffe3bf,0.99pt -2.40pt 0 #ffe3bf,1.84pt -1.84pt 0 #ffe3bf,2.40pt -0.99pt 0 #ffe3bf}
.name span{display:inline-block;margin-top:2pt;font-weight:700;font-size:17pt;color:#fff;background:#c86a00;border-radius:20pt;padding:4pt 16pt 6pt 16pt;line-height:1.3}
/* ---- الضهر ---- */
.quote{position:absolute;top:24mm;left:14mm;right:14mm;text-align:center;line-height:1.15}
.quote p{margin:0;font-weight:900;font-size:44pt;color:#1d1a17}
.quote .q2{margin-top:8pt;font-size:50pt;color:#c86a00}
.disc.d2{left:auto;right:-30mm;top:150mm;width:150mm;height:150mm}
.me.m2{left:auto;right:-6mm;bottom:0;height:150mm}
.qrs{position:absolute;left:14mm;top:128mm;width:70mm;display:flex;flex-direction:column;align-items:center;gap:7mm}
.qc{display:flex;flex-direction:column;align-items:center;gap:4pt;background:#fff;border:2.2pt solid #1d1a17;border-radius:5mm;padding:3mm 3mm 3.5mm 3mm}
.qc .qr{width:40mm;height:40mm}
.qc .qr img{width:100%;height:100%;display:block}
.qc b{font-weight:900;font-size:18pt;color:#1d1a17;line-height:1.2}
.wa{background:#1d1a17;color:#fff;border-radius:5mm;padding:3mm 6mm;text-align:center;line-height:1.2}
.wa small{display:block;font-weight:700;font-size:13pt;color:#f98e03}
.wa b{font-family:'CodeMono';font-size:17pt}
.bname{position:absolute;left:14mm;bottom:12mm;display:flex;align-items:center;gap:8pt}
.bname img{width:18mm;height:18mm;border-radius:50%;border:2pt solid #1d1a17}
.bname b{font-weight:900;font-size:24pt;color:#1d1a17}
</style>
</head>
<body>
<section class="cv front">
  <div class="wm">{ }</div>
  <div class="top"><span class="yr"><span class="n">2026 / 2027</span></span><img class="mini" src="assets/logo_warm.jpg" alt=""></div>
  <div class="ttl"><h1>البرمجة</h1><h2>والذكاء الاصطناعي</h2><div class="grade">الصف الثاني الثانوي <i></i> الترم الأول</div></div>
  <div class="disc"></div>
  <div class="robot"><svg viewBox="0 0 120 120"><line x1="60" y1="8" x2="60" y2="24" stroke="#1d1a17" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="8" r="7" fill="#f98e03" stroke="#1d1a17" stroke-width="4"/>
  <rect x="10" y="50" width="12" height="28" rx="6" fill="#1d1a17"/><rect x="98" y="50" width="12" height="28" rx="6" fill="#1d1a17"/>
  <rect x="18" y="24" width="84" height="80" rx="22" fill="#fff" stroke="#1d1a17" stroke-width="5"/>
  <rect x="30" y="40" width="60" height="38" rx="14" fill="#1d1a17"/>
  <circle cx="47" cy="59" r="8" fill="#f98e03"/><circle cx="73" cy="59" r="8" fill="#f98e03"/>
  <path d="M46 90 Q60 98 74 90" fill="none" stroke="#1d1a17" stroke-width="5" stroke-linecap="round"/></svg></div>
  <div class="brk"><svg viewBox="0 0 120 80"><g fill="none" stroke="#1d1a17" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
  <path d="M38 14 L12 40 L38 66"/><path d="M82 14 L108 40 L82 66"/></g><path d="M68 10 L52 70" stroke="#f98e03" stroke-width="11" stroke-linecap="round"/></svg></div>
  <div class="chip"><svg viewBox="0 0 100 100"><g stroke="#1d1a17" stroke-width="5" stroke-linecap="round">
  <path d="M32 8v14M50 8v14M68 8v14M32 78v14M50 78v14M68 78v14M8 32h14M8 50h14M8 68h14M78 32h14M78 50h14M78 68h14"/></g>
  <rect x="20" y="20" width="60" height="60" rx="10" fill="#f98e03" stroke="#1d1a17" stroke-width="5"/>
  <text x="50" y="62" text-anchor="middle" font-family="CodeMono" font-size="28" font-weight="700" fill="#1d1a17">AI</text></svg></div>
  <img class="me" src="assets/teacher_cut.png" alt="">
  <div class="card"><div class="cbar"><b></b><b></b><b></b></div><pre><k>if</k> study:
    success = <v>True</v></pre></div>
  <div class="name"><b>زياد السعدني</b><span>أستاذ البرمجة والذكاء الاصطناعي</span></div>
</section>
<section class="cv back">
  <div class="wm">&lt;/&gt;</div>
  <div class="quote"><p>الكود مجرد أداة…</p><p class="q2">القوة الحقيقية<br>في طريقة تفكيرك.</p></div>
  <div class="disc d2"></div>
  <img class="me m2" src="assets/teacher_cut.png" alt="">
  <div class="qrs">
    <div class="qc"><div class="qr"><img src="assets/qr_fb_warm.svg" alt=""></div><b>فيسبوك</b></div>
    <div class="qc"><div class="qr"><img src="assets/qr_yt_warm.svg" alt=""></div><b>يوتيوب</b></div>
    <div class="wa"><small>واتساب</small><b><span class="n">01124840835</span></b></div>
  </div>
  <div class="bname"><img src="assets/logo_warm.jpg" alt=""><b>أكواد مع زياد</b></div>
</section>
<script>document.fonts.ready.then(() => document.body.dataset.ready = "1")</script>
</body>
</html>
